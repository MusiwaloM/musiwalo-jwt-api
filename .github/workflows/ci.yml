name: Build and Test

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. Spin up a temporary Postgres database for the tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tender_scrapping_agent
          POSTGRES_PASSWORD: change-me-strong-password
          POSTGRES_DB: tender_scrapping_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Setup Test Database and User
      # 2. Create the users table and insert 'musiwalo' with 'password123' so tests pass
      run: |
        python -c "
        import psycopg2, bcrypt
        hash = bcrypt.hashpw(b'password123', bcrypt.gensalt()).decode()
        conn = psycopg2.connect('postgresql://tender_scrapping_agent:change-me-strong-password@127.0.0.1:5433/tender_scrapping_db')
        cur = conn.cursor()
        cur.execute('CREATE TABLE users (username VARCHAR(50), hashed_password VARCHAR(255), is_active BOOLEAN);')
        cur.execute('INSERT INTO users (username, hashed_password, is_active) VALUES (%s, %s, %s);', ('musiwalo', hash, True))
        conn.commit()
        "

    - name: Create .env file
      run: |
        echo "POSTGRES_USER=tender_scrapping_agent" >> .env
        echo "POSTGRES_PASSWORD=change-me-strong-password" >> .env
        echo "POSTGRES_DB=tender_scrapping_db" >> .env
        echo "DATABASE_URL=postgresql://tender_scrapping_agent:change-me-strong-password@127.0.0.1:5433/tender_scrapping_db" >> .env

    - name: Run tests
      run: |
        python -m pytest